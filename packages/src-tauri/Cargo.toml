[package]
name = "locus"
version = "0.1.0"
description = "A workspace for study and research."
authors = ["HYP3R00T"]
license = "MIT"
repository = "https://github.com/HYP3R00T/Locus"
edition = "2024"
publish = false

[lib]
name = "locus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
uuid = { version = "1.29.0", features = ["v4"] }
