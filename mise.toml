[tools]
node = "24.22.2"
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh" }

[env]
_.file = ".env"  # for sensitive data

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[tasks.install]
description = "Install locked workspace dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the Next.js frontend on an available local port"
run = "npm run dev"

[tasks.desktop]
description = "Start Tauri with the Next.js development server"
run = "npm run desktop:dev"

[tasks.check]
description = "Check frontend types and lint, then Rust formatting, lints, and tests"
run = ["npm run check", "npm run desktop:check"]

[tasks.build]
description = "Build the static frontend"
run = "npm run build"

[tasks."build:desktop"]
description = "Build the desktop application and native bundles"
run = "npm run desktop:build"
