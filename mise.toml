[tools]
node = "lts"
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh" }

[env]
_.file = ".env"  # for sensitive data

[tasks.dev]
description = "Develop the desktop application"
dir = "{{config_root}}/packages/src-tauri"
run = "npm exec -- tauri dev"

[tasks.build]
description = "Build a Debian installer"
dir = "{{config_root}}/packages/src-tauri"
run = "npm exec -- tauri build --bundles deb -- --locked"

[tasks.lint]
description = "Format source and apply safe lint fixes"
run = [
  "npm exec -- biome check --write .",
  "cargo fmt --manifest-path packages/src-tauri/Cargo.toml --all",
]

[tasks.website]
description = "Preview the standalone website"
run = "npm --prefix website run dev"
